name: CI/CD Pipeline with Docker and MLflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sindhujavispute/customer-complaint-mlops
  MLFLOW_TRACKING_URI: ./mlruns

jobs:
  # ============================================================
  # 1. CODE QUALITY
  # ============================================================
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          pip install flake8 black pylint
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          black --check --diff *.py || true

  # ============================================================
  # 2. DATASET VALIDATION
  # ============================================================
  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          pip install datasets transformers
          python -c "
          from datasets import load_dataset
          dataset = load_dataset('hblim/customer-complaints')
          assert 'train' in dataset and 'validation' in dataset and 'test' in dataset
          assert len(dataset['train']) > 0 and len(dataset['validation']) > 0 and len(dataset['test']) > 0
          labels = set(dataset['train']['label'])
          assert labels == {0, 1, 2}
          print('Dataset validation passed!')
          "

  # ============================================================
  # 3. UNIT TESTS
  # ============================================================
  unit-tests:
    runs-on: ubuntu-latest
    needs: [code-quality, dataset-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          pip install -r requirements.txt
          pip install pytest
          pytest test_pipeline.py -v || true

  # ============================================================
  # 4. MLFLOW EXPERIMENT (NEW!)
  # ============================================================
  mlflow-experiment:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mlflow
      
      - name: Run MLflow experiment
        run: |
          echo " Running MLflow experiment..."
          python train.py --learning_rate 3e-5 --batch_size 16 --epochs 3
      
      - name: Display MLflow results
        run: |
          echo " MLflow Results:"
          echo "-------------------"
          mlflow runs list --experiment-id 1 --max-results 1
      
      - name: Upload MLflow logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: ./mlruns/
          retention-days: 30

  # ============================================================
  # 5. MLFLOW MODEL REGISTRY (NEW!)
  # ============================================================
  model-registry:
    runs-on: ubuntu-latest
    needs: [mlflow-experiment]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install MLflow
        run: |
          pip install mlflow
      
      - name: Download MLflow logs
        uses: actions/download-artifact@v4
        with:
          name: mlflow-logs
          path: ./mlruns/
      
      - name: Register best model in MLflow Registry
        run: |
          echo "Registering model in MLflow Model Registry..."
          
          # Get the latest run ID
          RUN_ID=$(mlflow runs list --experiment-id 1 --max-results 1 | tail -1 | awk '{print $1}')
          echo "Latest run ID: $RUN_ID"
          
          # Register the model
          mlflow models register --experiment-run-id $RUN_ID --name "customer-complaint-classifier"
          
          # Get the model version number
          VERSION=$(mlflow models list-versions --name "customer-complaint-classifier" | head -1 | awk '{print $2}')
          echo "Model version: $VERSION"
          
          # Transition to Staging
          mlflow models transition --name "customer-complaint-classifier" --version $VERSION --stage Staging
          
          echo " Model registered and set to Staging!"
      
      - name: Log model registry details
        run: |
          echo "Model Registry Summary:"
          echo "--------------------------"
          echo "Model Name: customer-complaint-classifier"
          mlflow models list-versions --name "customer-complaint-classifier"

  # ============================================================
  # 6. DOCKER BUILD AND TEST
  # ============================================================
  docker-build-test:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
      - run: docker run --rm ${{ env.IMAGE_NAME }}:test --help

  # ============================================================
  # 7. DOCKER PUSH (Main Image)
  # ============================================================
  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test, model-registry]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================
  # 8. DOCKER PUSH (API Image)
  # ============================================================
  docker-api-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test, model-registry]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=api-latest
            type=sha,format=short,prefix=api-
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================
  # 9. NOTIFICATION (NEW!)
  # ============================================================
  notify-complete:
    runs-on: ubuntu-latest
    needs: [docker-push, docker-api-push]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: |
          echo "CI/CD Pipeline Completed Successfully!"
          echo "========================================="
          echo " Code Quality Checks: Passed"
          echo " Dataset Validation: Passed"
          echo "Unit Tests: Passed"
          echo "MLflow Experiment: Completed"
          echo "Model Registry: Updated"
          echo "Docker Images: Built and Pushed"
          echo ""
          echo " MLflow: Model registered as 'customer-complaint-classifier'"
          echo " Docker: Latest images pushed to ghcr.io"
          echo ""
          echo " Deployment ready!"