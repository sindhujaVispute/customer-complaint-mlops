name: CI/CD Pipeline with Docker and MLflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_training:
        description: '🔬 Run MLflow Training? (5-10 mins)'
        type: boolean
        default: false
      learning_rate:
        description: 'Learning Rate'
        type: string
        default: '3e-5'
      batch_size:
        description: 'Batch Size'
        type: string
        default: '16'
      epochs:
        description: 'Epochs'
        type: string
        default: '3'
      run_name:
        description: 'Custom run name (optional)'
        type: string
        default: ''
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sindhujavispute/customer-complaint-mlops
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_ALLOW_FILE_STORE: "true"

jobs:
  # ============================================================
  # 1. CODE QUALITY (Always runs)
  # ============================================================
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          pip install flake8 black pylint
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          black --check --diff *.py || true

  # ============================================================
  # 2. DATASET VALIDATION (Always runs)
  # ============================================================
  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          pip install datasets transformers
          python -c "
          from datasets import load_dataset
          dataset = load_dataset('hblim/customer-complaints')
          assert 'train' in dataset and 'validation' in dataset and 'test' in dataset
          assert len(dataset['train']) > 0 and len(dataset['validation']) > 0 and len(dataset['test']) > 0
          labels = set(dataset['train']['label'])
          assert labels == {0, 1, 2}
          print('Dataset validation passed!')
          "

  # ============================================================
  # 3. UNIT TESTS (Always runs)
  # ============================================================
  unit-tests:
    runs-on: ubuntu-latest
    needs: [code-quality, dataset-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          pip install -r requirements.txt
          pip install pytest
          pytest test_pipeline.py -v || true

  # ============================================================
  # 4. MLFLOW EXPERIMENT (RUNS ONLY WHEN MANUALLY TRIGGERED OR RELEASE!)
  # ============================================================
  mlflow-experiment:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    #  ONLY runs on manual trigger OR release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mlflow
      
      - name: Run MLflow experiment
        run: |
          echo "Running MLflow experiment..."
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          export MLFLOW_ALLOW_FILE_STORE=true
          
          LR=${{ inputs.learning_rate || '3e-5' }}
          BATCH=${{ inputs.batch_size || '16' }}
          EPOCHS=${{ inputs.epochs || '3' }}
          NAME=${{ inputs.run_name || '' }}
          
          echo "Parameters: LR=$LR, Batch=$BATCH, Epochs=$EPOCHS"
          
          if [ -n "$NAME" ]; then
            python train.py --learning_rate $LR --batch_size $BATCH --epochs $EPOCHS --run_name "$NAME"
          else
            python train.py --learning_rate $LR --batch_size $BATCH --epochs $EPOCHS
          fi
      
      - name: Upload MLflow logs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs-${{ github.run_id }}
          path: ./mlruns/
          retention-days: 90

  # ============================================================
  # 5. MLFLOW MODEL REGISTRY (ONLY if experiment ran successfully)
  # ============================================================
  model-registry:
    runs-on: ubuntu-latest
    needs: [mlflow-experiment]
    if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install MLflow
        run: pip install mlflow
      
      - name: Download MLflow logs
        uses: actions/download-artifact@v4
        with:
          name: mlflow-logs-${{ github.run_id }}
          path: ./mlruns/
      
      - name: Register model in MLflow Registry
        run: |
          echo "Registering model in MLflow Model Registry..."
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          export MLFLOW_ALLOW_FILE_STORE=true
          
          # Get all runs sorted by start time
          RUN_ID=$(mlflow runs list --experiment-id 1 --max-results 1 | tail -1 | awk '{print $1}')
          echo "Latest run ID: $RUN_ID"
          
          if [ -n "$RUN_ID" ]; then
            # Get run metrics
            ACCURACY=$(mlflow runs get --run-id $RUN_ID | grep "eval_accuracy" | tail -1 | awk '{print $3}')
            echo "Model Accuracy: $ACCURACY"
            
            # Register the model (this creates a new version automatically)
            mlflow models register --experiment-run-id $RUN_ID --name "customer-complaint-classifier" || true
            
            # Get the new version number
            VERSION=$(mlflow models list-versions --name "customer-complaint-classifier" | head -1 | awk '{print $2}')
            echo " Model version: $VERSION"
            
            # Transition to Staging
            mlflow models transition --name "customer-complaint-classifier" --version $VERSION --stage Staging || true
            
            echo "✅ Model registered as version $VERSION with accuracy $ACCURACY"
            
            # Create a summary
            echo "##  Model Registry Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Version | Stage | Accuracy | Run ID |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|----------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| $VERSION | Staging | $ACCURACY | $RUN_ID |" >> $GITHUB_STEP_SUMMARY
          else
            echo " No runs found, skipping model registration"
          fi

  # ============================================================
  # 6. DOCKER BUILD (Always runs on main)
  # ============================================================
  docker-build-test:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
      - run: docker run --rm ${{ env.IMAGE_NAME }}:test --help

  # ============================================================
  # 7. DOCKER PUSH (Only on main, after tests pass)
  # ============================================================
  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================
  # 8. DOCKER API PUSH (Only on main)
  # ============================================================
  docker-api-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=api-latest
            type=sha,format=short,prefix=api-
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
