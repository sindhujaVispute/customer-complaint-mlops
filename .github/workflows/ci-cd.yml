name: CI/CD Pipeline with Docker

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Code Quality
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint
      
      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check formatting
        run: black --check --diff *.py || true

  # Job 2: Dataset Validation
  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets transformers
      
      - name: Validate dataset
        run: |
          python -c "
          from datasets import load_dataset
          dataset = load_dataset('hblim/customer-complaints')
          assert 'train' in dataset and 'validation' in dataset and 'test' in dataset
          assert len(dataset['train']) > 0 and len(dataset['validation']) > 0 and len(dataset['test']) > 0
          labels = set(dataset['train']['label'])
          assert labels == {0, 1, 2}
          print('✅ Dataset validation passed!')
          print(f'  Train: {len(dataset[\"train\"])}')
          print(f'  Validation: {len(dataset[\"validation\"])}')
          print(f'  Test: {len(dataset[\"test\"])}')
          "

  # Job 3: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: [code-quality, dataset-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest test_pipeline.py -v --cov=. --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Job 4: Build and Test Docker Image
  docker-build-test:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Build Docker image (CPU version)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      
      - name: Test Docker container
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test --help
          echo "✅ Docker image built successfully!"
      
      # Create test model for container validation
      - name: Create test model
        run: |
          mkdir -p artifacts/final_model
          echo "Test model" > artifacts/final_model/test.txt
      
      - name: Test prediction in container
        run: |
          docker run --rm -v $(pwd)/artifacts:/app/artifacts ${{ env.IMAGE_NAME }}:test predict.py "My package has not arrived"
      
      # Clean up cache
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Job 5: Build and Push Docker Image (only on main/release)
  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Build API Docker Image
  docker-api-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Job 7: Deploy (Example with Docker Compose)
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-push, docker-api-push]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy using Docker Compose
        run: |
          echo "🚀 Deploying application..."
          echo "Deployment environment: production"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "API Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-latest"
          # Add actual deployment commands here (e.g., docker compose up -d)
      
      - name: Notify deployment
        run: |
          echo "✅ Deployment complete!"
          echo "📊 MLflow UI: http://your-server:5000"
          echo "🔗 API Endpoint: http://your-server:8000/docs"

  # Job 8: Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Job 9: Docker Image Size Report
  image-size-report:
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get image size
        run: |
          echo "📦 Docker Image Size Report"
          echo "==========================="
          echo "Base Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "API Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-latest"
          echo ""
          echo "Check container registry for actual sizes"